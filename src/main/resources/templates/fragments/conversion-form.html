<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="conversionForm(units, action)">

        <form th:action="${action}"
              th:object="${form}"
              method="post">

            <label for="value">Valor:</label>
            <input id="value"
                   type="number"
                   th:field="*{value}"
                   step="any"
                   required>
            <p th:if="${#fields.hasErrors('value')}"
               th:errors="*{value}"></p>

            <label for="fromValue">De:</label>
            <select id="fromValue"
                    th:field="*{fromValue}">
                <option
                        th:each="unit : ${units}"
                        th:value="${unit}"
                        th:text="${unit.displayName}">
                </option>
            </select>
            <p th:if="${#fields.hasErrors('fromValue')}"
               th:errors="*{fromValue}"></p>

            <label for="toValue">Para:</label>
            <select id="toValue"
                    th:field="*{toValue}">
                <option
                    th:each="unit : ${units}"
                    th:value="${unit}"
                    th:text="${unit.displayName}">
                </option>
            </select>
            <p th:if="${#fields.hasErrors('toValue')}"
               th:errors="*{toValue}"></p>

            <button type="submit">Converter</button>
        </form>

        <div th:if="${result != null}">
            <p th:text="${result}"></p>
        </div>
    </div>

</body>
</html>
